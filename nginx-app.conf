# Nginx Configuration for Bartimeo App
# Place this in /etc/nginx/sites-available/bartimeo and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Replace with your domain if available, e.g., retirobartimeo.org

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # Root directory (optional, mainly for static files if served directly via nginx, 
    # but here we proxy to Node.js mostly. However, we can serve /dist/client directly for performance)
    root /home/ubuntu/reto-pjr/dist/client;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Static assets caching (Astro generates hashed filenames usually, so long cache is fine)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy everything else to the Node.js application
    location / {
        try_files $uri @proxy;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
